name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: faliz-village-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
